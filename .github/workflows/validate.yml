name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  policies:
    name: Policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest -q

  kubernetes:
    name: Render + schema-validate overlays
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: kustomize build | kubeconform
        run: |
          for env in staging production; do
            echo "::group::$env"
            kubectl kustomize "k8s/overlays/$env" > "/tmp/$env.yaml"
            kubeconform -strict -summary -kubernetes-version 1.31.0 "/tmp/$env.yaml"
            echo "::endgroup::"
          done
      - name: Validate Argo CD applications (CRD schemas)
        run: |
          kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            gitops/applications.yaml

  prometheus:
    name: Alert rules (promtool)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check and unit-test rules
        run: |
          docker run --rm -v "$PWD/observability/prometheus:/rules" --workdir /rules \
            --entrypoint promtool prom/prometheus:v2.53.0 check rules slo-rules.yaml
          docker run --rm -v "$PWD/observability/prometheus:/rules" --workdir /rules \
            --entrypoint promtool prom/prometheus:v2.53.0 test rules slo-rules.test.yaml

  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive terraform
      - name: validate each environment
        run: |
          for env in staging production; do
            terraform -chdir="terraform/envs/$env" init -backend=false -input=false
            terraform -chdir="terraform/envs/$env" validate
          done

  security:
    name: Misconfiguration scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Third-party action pinned by commit SHA: a tag can be moved, a SHA cannot.
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          format: table
          output: trivy.txt
          exit-code: "0" # report first, then gate below
          trivyignores: .trivyignore
      - name: Publish findings to the job summary
        if: always()
        run: |
          { echo '### Trivy misconfiguration scan (HIGH, CRITICAL)'; echo '```'; cat trivy.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail on unaccepted findings
        run: |
          if grep -Eq 'Failures: [1-9]' trivy.txt; then
            echo "::error::Trivy found HIGH/CRITICAL misconfigurations (see job summary)"
            exit 1
          fi
