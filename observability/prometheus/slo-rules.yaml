# SLOs with multi-window, multi-burn-rate alerts (Google SRE Workbook, ch. 5).
#
# llm-gateway availability SLO: 99.5% of requests over 30 days succeed.
#   Error budget = 0.5%. Counted as errors: outcomes caused by us or by providers
#   (all_providers_failed, upstream_failed, stream_interrupted). Client mistakes
#   (bad keys, rate limits, exhausted budgets, refused prompts) are not errors.
#
# Why burn rates: a fixed "error rate > 1%" alert either pages on short blips or
# misses slow leaks. Burn rate = how fast the monthly budget is being spent.
#   14.4x over 1h  → 2% of the monthly budget gone in an hour → page
#    6x  over 6h  → 5% gone                                   → page
#    1x  over 3d  → on track to miss the SLO                  → ticket
# Each page also requires a short window to agree, so it clears quickly once fixed.
groups:
  - name: llm-gateway-slo-recording
    interval: 30s
    rules:
      - record: gateway:error_ratio:rate5m
        expr: |
          sum(rate(gateway_requests_total{outcome=~"all_providers_failed|upstream_failed|stream_interrupted"}[5m]))
          / clamp_min(sum(rate(gateway_requests_total[5m])), 1e-9)
      - record: gateway:error_ratio:rate30m
        expr: |
          sum(rate(gateway_requests_total{outcome=~"all_providers_failed|upstream_failed|stream_interrupted"}[30m]))
          / clamp_min(sum(rate(gateway_requests_total[30m])), 1e-9)
      - record: gateway:error_ratio:rate1h
        expr: |
          sum(rate(gateway_requests_total{outcome=~"all_providers_failed|upstream_failed|stream_interrupted"}[1h]))
          / clamp_min(sum(rate(gateway_requests_total[1h])), 1e-9)
      - record: gateway:error_ratio:rate6h
        expr: |
          sum(rate(gateway_requests_total{outcome=~"all_providers_failed|upstream_failed|stream_interrupted"}[6h]))
          / clamp_min(sum(rate(gateway_requests_total[6h])), 1e-9)
      - record: gateway:error_ratio:rate3d
        expr: |
          sum(rate(gateway_requests_total{outcome=~"all_providers_failed|upstream_failed|stream_interrupted"}[3d]))
          / clamp_min(sum(rate(gateway_requests_total[3d])), 1e-9)
      - record: gateway:latency_seconds:p95_5m
        expr: histogram_quantile(0.95, sum by (le, route) (rate(gateway_request_seconds_bucket{mode="full"}[5m])))
      - record: gateway:cost_usd:rate1h
        expr: sum by (key) (rate(gateway_cost_usd_total[1h])) * 3600

  - name: llm-gateway-slo-alerts
    rules:
      - alert: GatewayErrorBudgetBurnFast
        expr: |
          gateway:error_ratio:rate1h > (14.4 * 0.005)
          and gateway:error_ratio:rate5m > (14.4 * 0.005)
        labels: { severity: page, slo: gateway-availability }
        annotations:
          summary: llm-gateway is burning its 30-day error budget 14x too fast
          runbook_url: https://github.com/affifariza04/platform/blob/main/docs/runbooks/llm-gateway.md#error-budget-burn
      - alert: GatewayErrorBudgetBurnSlow
        expr: |
          gateway:error_ratio:rate6h > (6 * 0.005)
          and gateway:error_ratio:rate30m > (6 * 0.005)
        labels: { severity: page, slo: gateway-availability }
        annotations:
          summary: llm-gateway error budget burning 6x too fast for 6h
          runbook_url: https://github.com/affifariza04/platform/blob/main/docs/runbooks/llm-gateway.md#error-budget-burn
      - alert: GatewayErrorBudgetAtRisk
        expr: gateway:error_ratio:rate3d > 0.005
        labels: { severity: ticket, slo: gateway-availability }
        annotations:
          summary: llm-gateway is on track to miss its 99.5% availability SLO

  - name: llm-gateway-causes
    rules:
      # The symptom alerts above page; these explain why and become tickets.
      - alert: GatewayProviderBreakerOpen
        expr: max by (target) (gateway_breaker_open) == 1
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: "Circuit breaker for {{ $labels.target }} open for 5m: traffic is on fallbacks"
          runbook_url: https://github.com/affifariza04/platform/blob/main/docs/runbooks/llm-gateway.md#breaker-open
      - alert: GatewaySpendAnomaly
        expr: gateway:cost_usd:rate1h > 3 * avg_over_time(gateway:cost_usd:rate1h[7d])
        for: 30m
        labels: { severity: ticket }
        annotations:
          summary: "Key {{ $labels.key }} is spending 3x its weekly average"
          runbook_url: https://github.com/affifariza04/platform/blob/main/docs/runbooks/llm-gateway.md#spend-anomaly
