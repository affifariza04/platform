apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
spec:
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 25%, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: llm-gateway }
  template:
    metadata:
      labels: { app.kubernetes.io/name: llm-gateway }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: llm-gateway
      automountServiceAccountToken: false
      # Streams can run for minutes, so in-flight generations get time to finish on rollout.
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: llm-gateway }
      containers:
        - name: llm-gateway
          image: ghcr.io/affifariza04/llm-gateway:latest # pinned per environment by the overlay
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: GATEWAY_CONFIG, value: /config/gateway.toml }
            - { name: UV_NO_CACHE, value: "1" }
            - name: ANTHROPIC_API_KEY
              valueFrom: { secretKeyRef: { name: llm-provider-keys, key: anthropic } }
            - name: GEMINI_API_KEY
              valueFrom: { secretKeyRef: { name: llm-provider-keys, key: gemini, optional: true } }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { memory: 512Mi } # no CPU limit: avoids CFS throttling on a latency-sensitive proxy
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          lifecycle:
            preStop:
              sleep: { seconds: 5 } # let the load balancer stop routing here first
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap: { name: llm-gateway-config }
        - { name: tmp, emptyDir: {} }
