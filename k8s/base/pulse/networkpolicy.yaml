apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pulse
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: pulse }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
      ports: [{ port: 3030 }]
