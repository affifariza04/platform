apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
spec:
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 25%, maxUnavailable: 0 }  # never drop below desired capacity
  selector:
    matchLabels: { app.kubernetes.io/name: storefront }
  template:
    metadata:
      labels: { app.kubernetes.io/name: storefront }
    spec:
      serviceAccountName: storefront
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: storefront }
      containers:
        - name: storefront
          image: ghcr.io/affifariza04/storefront:latest  # pinned per environment by the overlay
          ports:
            - { name: http, containerPort: 3000 }
          env:
            - { name: NODE_ENV, value: production }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: storefront-secrets, key: database-url } }
            - name: PAYMENT_WEBHOOK_SECRET
              valueFrom: { secretKeyRef: { name: storefront-secrets, key: payment-webhook-secret } }
            - name: ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: storefront-secrets, key: admin-password } }
            - name: ADMIN_SESSION_SECRET
              valueFrom: { secretKeyRef: { name: storefront-secrets, key: admin-session-secret } }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }  # no CPU limit: avoids CFS throttling on a latency-sensitive app
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          lifecycle:
            preStop:
              # Give the load balancer time to stop sending traffic before shutdown.
              sleep: { seconds: 5 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: next-cache, mountPath: /app/.next/cache }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: next-cache, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
