apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: storefront
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: storefront }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
      ports: [{ port: 3000 }]
  egress:
    - to:
        - ipBlock: { cidr: 10.0.0.0/16 } # VPC: RDS Postgres
      ports: [{ port: 5432 }]
    # Payment provider API (and, with the MockPay sandbox, the app's own public
    # URL, which it calls to deliver the signed webhook). Instance metadata is excluded.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [169.254.169.254/32]
      ports: [{ port: 443 }]
