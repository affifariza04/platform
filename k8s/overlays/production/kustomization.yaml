apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: apps-prod
resources:
  - namespace.yaml
  - ingress.yaml
  - ../../base/common
  - ../../base/storefront
  - ../../base/llm-gateway
  - ../../base/pulse
# Production only ever receives tags that already passed staging (see gitops/README).
images:
  - name: ghcr.io/affifariza04/storefront
    newTag: sha-0000000
  - name: ghcr.io/affifariza04/llm-gateway
    newTag: sha-0000000
  - name: ghcr.io/affifariza04/pulse
    newTag: sha-0000000
patches:
  # Three zones → at least three replicas, and two must survive a node drain.
  - target: { kind: HorizontalPodAutoscaler }
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
  - target: { kind: PodDisruptionBudget }
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 2
  - target: { kind: Deployment, name: storefront }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 250m, memory: 512Mi }
          limits: { memory: 1Gi }
  - target: { kind: StatefulSet, name: pulse }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: https://chat.affifariza04.dev
